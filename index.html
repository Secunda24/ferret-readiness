<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FerretConnect Ferret Readiness Assessment</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#24231f;--muted:#6d685e;--brand:#5d4937;--line:#ded7ca;--soft:#eee8dd;--danger:#8b2f2f}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#ece6da,#f7f4ee 35%,#eee8dd);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:820px;margin:auto;padding:28px 16px 70px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #4b3d2d18;padding:28px}.brand{text-align:center;font-weight:900;letter-spacing:.08em;color:var(--brand)}h1{font-size:clamp(30px,6vw,48px);line-height:1.03;text-align:center;margin:12px 0}.lead{text-align:center;color:var(--muted);font-size:17px;line-height:1.6}.notice{background:var(--soft);border-left:4px solid var(--brand);padding:15px 16px;border-radius:12px;margin:20px 0;line-height:1.5}.progress{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:14px 0 8px}.bar{height:100%;background:var(--brand);width:0;transition:.3s}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.q{font-size:24px;line-height:1.3;margin:22px 0 16px}.help{color:var(--muted);font-size:14px;margin:-8px 0 16px}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:15px 16px;border-radius:14px;font-size:16px;cursor:pointer}.option:hover,.option.selected{border-color:var(--brand);background:var(--soft)}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:13px;padding:14px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:130px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;justify-content:space-between;margin-top:22px}button.primary,button.secondary{border:0;border-radius:13px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:white}.secondary{background:var(--soft);color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}.error{color:var(--danger);font-weight:700;margin-top:12px}.hidden{display:none}.done{text-align:center;padding:30px 0}.done .id{font-size:22px;font-weight:900;background:var(--soft);padding:12px;border-radius:12px;margin:18px 0}.tiny{font-size:12px;color:var(--muted)}label.check{display:flex;gap:10px;align-items:flex-start;line-height:1.45}label.check input{width:auto;margin-top:4px}@media(max-width:620px){.card{padding:20px}.grid{grid-template-columns:1fr}.q{font-size:21px}}
</style></head><body><main><div class="card" id="app"></div></main>
<script>
const API_BASE="https://ferret-readiness-api.jayjacobs.workers.dev";
const sections={1:"About You & Your Decision",6:"Ferret Knowledge",15:"Home & Environment",23:"Food & Daily Care",27:"Veterinary & Financial Preparedness",33:"Time & Lifestyle",39:"Long-Term Commitment & Real-Life Scenarios",47:"Final Commitment"};
const qs=[
[1,"Why do you want a ferret?","text","Please explain in your own words rather than giving the answer you think a breeder wants to hear."],
[2,"How long have you been considering getting a ferret?","choice",["Less than a week","1–4 weeks","1–3 months","3–12 months","More than a year"]],
[3,"Have you owned ferrets before? If yes, tell us what happened to them and how long you had them.","text"],
[4,"Who else lives in your household, and is everyone genuinely comfortable with a ferret joining the home?","text"],
[5,"Before this application, what research have you done about ferrets?","text","Mention sources, people, vets, groups, articles or firsthand experience where relevant."],
[6,"What do you believe are the three hardest parts of living with ferrets?","text"],
[7,"How long do you believe a ferret may live, and what does that mean for your commitment?","text"],
[8,"What behaviours do you expect from a normal healthy ferret that could be frustrating or destructive?","text"],
[9,"What does 'ferret-proofing' mean to you? Give practical examples.","text"],
[10,"Why can ferrets be difficult pets for someone who impulse-buys one?","text"],
[11,"What signs would make you suspect that a ferret needs veterinary attention?","text"],
[12,"What do you understand about ferrets and heat/temperature risk?","text"],
[13,"What do you understand about a jill remaining in season and why this can become dangerous?","text"],
[14,"If information from a pet shop conflicts with an experienced ferret veterinarian or responsible breeder, how would you decide what to follow?","text"],
[15,"Describe exactly where the ferret will live and sleep.","text"],
[16,"Describe the ferret's expected access to rooms/free-roam time during a normal day.","text"],
[17,"How will you ferret-proof doors, windows, cupboards, appliances, reclining furniture, drains and other escape/injury hazards?","text"],
[18,"Do you rent or own your home, and if renting, do you have permission for the animal?","text"],
[19,"What other animals live in the home, and how would you manage introductions and safety?","text"],
[20,"Are there children in the home or regular child visitors? If yes, how will interaction be supervised?","text"],
[21,"Who will be responsible for daily cleaning, feeding, enrichment and health observation?","text"],
[22,"If we asked for photos/video of the proposed ferret area before placement, would you provide them?","choice",["Yes","Yes, but I may need help preparing it","No"]],
[23,"What do you intend to feed your ferret on a normal day? Be specific.","text"],
[24,"What foods or treats do you believe should NOT be routinely fed to ferrets, and why?","text"],
[25,"What monthly amount have you realistically budgeted for food, litter, enrichment and routine care?","text"],
[26,"What supplies do you expect to purchase before the ferret arrives?","text"],
[27,"Which veterinary practice would you use for your ferret? If you have not chosen one, explain your plan to find one.","text"],
[28,"Have you confirmed that this veterinarian is willing and able to treat ferrets?","choice",["Yes","Not yet, but I will confirm before placement","I have not looked for a vet yet","There is no suitable vet near me"]],
[29,"How far are you prepared to travel for a ferret-capable veterinarian?","text"],
[30,"What would you do if your normal vet could not see your ferret during an emergency?","text"],
[31,"What amount could you access for an unexpected veterinary emergency without waiting weeks to obtain it?","text","There is no 'correct' rand amount; we want to understand your realistic plan."],
[32,"Your ferret suddenly needs approximately R8,000 of urgent veterinary treatment this month. You did not expect the expense. Explain exactly what you would do.","text"],
[33,"Describe a normal weekday for your household from morning until bedtime and where the ferret fits into it.","text"],
[34,"Approximately how many hours per day are you normally away from home?","choice",["0–4 hours","4–8 hours","8–10 hours","10–12 hours","More than 12 hours","Varies significantly"]],
[35,"What daily interaction and enrichment do you realistically expect to provide?","text"],
[36,"What happens to the ferret when you go away for a weekend or holiday?","text"],
[37,"Who is your backup caregiver if you become sick, are hospitalized, or cannot get home?","text"],
[38,"If your work, relationship or living situation changes, what is your plan for keeping the ferret part of your life?","text"],
[39,"A month after getting your ferret, the smell is stronger than you expected and cleaning takes more work than expected. What do you do?","text"],
[40,"Your ferret repeatedly digs at carpets, steals objects and gets into places you thought were secure. What do you do?","text"],
[41,"Six months later, your ferret still bites at times, makes mess, damages things and wakes you at inconvenient times. You are frustrated. What happens next?","text"],
[42,"Your ferret does not bond with you as quickly as you hoped. Months pass and it still prefers exploring to cuddling. How would you handle that?","text"],
[43,"You move to a property where the landlord says no ferrets. What steps would you take?","text"],
[44,"Your financial situation becomes significantly worse for six months. How would you protect the ferret's food and veterinary needs?","text"],
[45,"A partner or family member later tells you they no longer want the ferret in the home. What would you do?","text"],
[46,"List circumstances where you believe rehoming a ferret would be justified, and explain why.","text"],
[47,"If you discover after placement that something you believed about ferret care was wrong, how would you respond?","text"],
[48,"Would you be willing to stay in contact with the breeder/rescue, ask for help early, and provide reasonable welfare updates if that is part of the placement agreement?","choice",["Yes","Yes, with reasonable privacy boundaries","No"]],
[49,"What would make you decide NOT to get a ferret right now, even if one were available today?","text"],
[50,"In your own words: why should a ferret be placed in your care for the rest of its life?","text","This is not a sales pitch. We are looking for realistic commitment, not perfection."]
];
let step=-1,answers={},profile={},started=new Date().toISOString();const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function intro(){app.innerHTML=`<div class="brand">FERRETCONNECT</div><h1>Ferret Readiness Assessment</h1><p class="lead">A ferret is not an impulse purchase. This assessment is designed to make prospective owners think through the reality of long-term ferret care before placement is discussed.</p><div class="notice"><b>Important:</b> This is a screening and education tool, not an automated approval system. Your answers will be stored, checked for welfare concerns and analysed by AI to assist a human reviewer. The breeder/rescue makes the final placement decision.</div><div class="grid"><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone / WhatsApp"><input id="city" placeholder="Town / City"></div><div style="margin-top:18px"><label class="check"><input type="checkbox" id="consent"><span>I consent to FerretConnect storing and analysing my answers for the purpose of assessing a possible ferret placement. I understand that completing this assessment does not guarantee approval or reservation of a ferret.</span></label></div><div id="err" class="error"></div><div class="actions"><span></span><button class="primary" onclick="start()">Begin 50-question assessment →</button></div><p class="tiny">Please answer honestly. Detailed, realistic answers are more useful than answers written merely to sound correct.</p>`}
function start(){const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),phoneEl=document.getElementById('phone'),cityEl=document.getElementById('city'),consentEl=document.getElementById('consent'),errEl=document.getElementById('err');profile={applicant_name:nameEl.value.trim(),email:emailEl.value.trim(),phone:phoneEl.value.trim(),city:cityEl.value.trim(),consent:consentEl.checked};let e=[];if(!profile.applicant_name)e.push('Name is required.');if(!profile.email||!profile.email.includes('@'))e.push('A valid email is required.');if(!profile.consent)e.push('Consent is required.');if(e.length){errEl.textContent=e.join(' ');return}step=0;render()}
function render(){const [n,q,type,data]=qs[step],pct=Math.round((step/50)*100);let body='';if(type==='choice'){body=`<div class="options">${data.map(x=>`<button class="option ${answers[n]===x?'selected':''}" onclick='pick(${n},${JSON.stringify(x)})'>${esc(x)}</button>`).join('')}</div>`}else body=`<textarea id="ans" placeholder="Write your answer here...">${esc(answers[n]||'')}</textarea>`;app.innerHTML=`<div class="brand">FERRETCONNECT • READINESS</div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="meta"><span>${esc(sections[n]||'Ferret Readiness')}</span><span>${n} / 50</span></div><div class="q">${n}. ${esc(q)}</div>${type==='text'&&data?`<div class="help">${esc(data)}</div>`:''}${body}<div id="err" class="error"></div><div class="actions"><button class="secondary" onclick="back()" ${step===0?'disabled':''}>← Back</button><button class="primary" onclick="next()">${n===50?'Review & submit':'Continue →'}</button></div>`}
function pick(n,v){answers[n]=v;render()}
function saveText(){const [n,,type]=qs[step];if(type==='text'){const el=document.getElementById('ans');answers[n]=el.value.trim()}}
function next(){saveText();const n=qs[step][0];if(!answers[n]||String(answers[n]).trim().length<2){err.textContent='Please answer this question before continuing.';return}if(step<49){step++;render()}else review()}
function back(){saveText();if(step>0){step--;render()}}
function review(){app.innerHTML=`<div class="brand">FERRETCONNECT</div><h1>Before you submit</h1><p class="lead">You answered all 50 questions. Your application will now be stored and analysed to assist a human welfare review.</p><div class="notice">AI may identify contradictions, concerns and follow-up questions, but it does <b>not</b> make the final placement decision. FerretConnect or the breeder/rescue may contact you for clarification, photos, a conversation or additional information.</div><label class="check"><input type="checkbox" id="confirm"><span>I confirm that my answers are truthful to the best of my knowledge and reflect my actual intended living arrangements and commitment.</span></label><div id="err" class="error"></div><div class="actions"><button class="secondary" onclick="step=49;render()">← Edit last answer</button><button class="primary" id="submit" onclick="submitApp()">Submit application</button></div>`}
async function submitApp(){if(!confirm.checked){err.textContent='Please confirm that your answers are truthful.';return}if(API_BASE.includes('PASTE_')){err.textContent='This assessment has not yet been connected to its API.';return}submit.disabled=true;submit.textContent='Submitting & analysing…';const payload={...profile,answers:qs.map(([number,question])=>({number,question,answer:answers[number]})),started_at:started,completed_at:new Date().toISOString()};try{const r=await fetch(API_BASE+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Submission failed');app.innerHTML=`<div class="done"><div class="brand">FERRETCONNECT</div><h1>Application received</h1><p class="lead">Thank you for taking the time to think seriously about ferret ownership. Your answers have been submitted for review.</p><div class="id">${esc(d.application_id)}</div><p>Keep this application ID. A reviewer may contact you if anything needs clarification.</p><div class="notice"><b>This is not an approval.</b> No ferret is reserved or promised by submitting this assessment.</div></div>`}catch(e){submit.disabled=false;submit.textContent='Submit application';err.textContent=e.message+' Please try again.'}}
intro();
</script></body></html>
